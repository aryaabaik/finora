<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E9D7AE"/>
      <stop offset="50%" style="stop-color:#C9A45C"/>
      <stop offset="100%" style="stop-color:#B08D2F"/>
    </linearGradient>
    <linearGradient id="gNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#17345C"/>
      <stop offset="100%" style="stop-color:#102A4A"/>
    </linearGradient>
    <linearGradient id="gNavyLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#243447"/>
      <stop offset="100%" style="stop-color:#1A2332"/>
    </linearGradient>
  </defs>
  <!-- Outer decorative circle -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#gGold)" stroke-width="2" opacity="0.5"/>
  <!-- Inner navy background -->
  <circle cx="100" cy="100" r="82" fill="url(#gNavy)"/>
  <!-- Inner gold ring -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="url(#gGold)" stroke-width="1.5" opacity="0.4"/>
  <!-- Coin base circle -->
  <circle cx="100" cy="100" r="42" fill="none" stroke="url(#gGold)" stroke-width="2" opacity="0.6"/>
  <!-- Small inner circle -->
  <circle cx="100" cy="100" r="24" fill="url(#gNavyLight)" stroke="url(#gGold)" stroke-width="1"/>
  <!-- F letter -->
  <text x="100" y="115" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="56" font-weight="700" fill="url(#gGold)">F</text>
  <!-- Decorative dots -->
  <circle cx="100" cy="20" r="3" fill="#C9A45C" opacity="0.4"/>
  <circle cx="100" cy="180" r="3" fill="#C9A45C" opacity="0.4"/>
  <circle cx="20" cy="100" r="3" fill="#C9A45C" opacity="0.4"/>
  <circle cx="180" cy="100" r="3" fill="#C9A45C" opacity="0.4"/>
  <!-- Botanical leaf accents -->
  <path d="M100 30 Q115 50 100 70 Q85 50 100 30Z" fill="none" stroke="#C9A45C" stroke-width="1" opacity="0.3"/>
  <path d="M100 130 Q115 150 100 170 Q85 150 100 130Z" fill="none" stroke="#C9A45C" stroke-width="1" opacity="0.3"/>
  <path d="M30 100 Q50 115 70 100 Q50 85 30 100Z" fill="none" stroke="#C9A45C" stroke-width="1" opacity="0.3"/>
  <path d="M130 100 Q150 115 170 100 Q150 85 130 100Z" fill="none" stroke="#C9A45C" stroke-width="1" opacity="0.3"/>
  <!-- Star sparkles -->
  <circle cx="55" cy="55" r="2" fill="#C9A45C" opacity="0.5"/>
  <circle cx="145" cy="55" r="2" fill="#C9A45C" opacity="0.5"/>
  <circle cx="55" cy="145" r="2" fill="#C9A45C" opacity="0.5"/>
  <circle cx="145" cy="145" r="2" fill="#C9A45C" opacity="0.5"/>
  <!-- Small decorative lines -->
  <line x1="100" y1="45" x2="100" y2="35" stroke="#C9A45C" stroke-width="1" opacity="0.4"/>
  <line x1="100" y1="155" x2="100" y2="165" stroke="#C9A45C" stroke-width="1" opacity="0.4"/>
  <line x1="45" y1="100" x2="35" y2="100" stroke="#C9A45C" stroke-width="1" opacity="0.4"/>
  <line x1="155" y1="100" x2="165" y2="100" stroke="#C9A45C" stroke-width="1" opacity="0.4"/>
</svg>
