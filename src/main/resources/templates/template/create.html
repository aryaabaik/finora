<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Template - Finora</title>
    <link rel="stylesheet" th:href="@{/css/template.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
    <div class="paper-texture"></div>

    <div class="layout">
        <div th:replace="fragments/navigation :: mobile-header"></div>
        <div th:replace="fragments/navigation :: bottom-nav"></div>
        <div th:replace="fragments/navigation :: drawer-overlay"></div>
        <nav th:replace="fragments/navigation :: drawer"></nav>
        <aside th:replace="fragments/navigation :: sidebar"></aside>

        <main class="main-content">

            <div class="form-wrapper">
                <div class="form-card">
                    <div class="form-header">
                        <span class="annotation">BUAT TEMPLATE</span>
                        <h1>Buat Template</h1>
                    </div>

                    <form th:action="@{/template/create}" method="post">

                        <div class="form-group">
                            <label for="nama">Nama Template</label>
                            <input type="text" id="nama" name="nama" required>
                        </div>

                        <div class="form-group">
                            <label for="jenis">Jenis Template</label>
                            <select id="jenis" name="jenis" required>
                                <option value="">-- Pilih Jenis --</option>
                                <option value="PEMASUKAN">Pemasukan</option>
                                <option value="PENGELUARAN">Pengeluaran</option>
                            </select>
                        </div>

                        <div class="form-divider"></div>

                        <label style="margin-bottom:14px;">Item Template</label>

                        <select id="kategori-options-template" style="display: none;" data-no-custom>
                            <option value="">-- Pilih Kategori --</option>
                            <option th:each="kategori : ${kategoriList}"
                                    th:value="${kategori.id}"
                                    th:text="${kategori.nama}"></option>
                        </select>

                        <div id="items-container" class="items-list">
                            <div class="form-item">
                                <div class="item-field">
                                    <label>Keterangan</label>
                                    <input type="text" name="items[0].keterangan" maxlength="225" placeholder="Contoh: Internet" required>
                                </div>
                                <div class="item-field">
                                    <label>Kategori</label>
                                    <select name="items[0].kategori.id" required>
                                        <option value="">-- Pilih --</option>
                                        <option th:each="kategori : ${kategoriList}"
                                                th:value="${kategori.id}"
                                                th:text="${kategori.nama}"></option>
                                    </select>
                                </div>
                                <div class="item-field">
                                    <label>Jumlah</label>
                                    <div class="item-amount-group">
                                        <span class="currency-prefix">Rp</span>
                                        <input type="text" inputmode="numeric" name="items[0].jumlah" class="item-amount-input" placeholder="0" autocomplete="off" required>
                                    </div>
                                </div>
                                <button type="button" class="remove-item-btn" onclick="hapusItem(this)">&#10005;</button>
                            </div>
                        </div>

                        <button type="button" class="btn-add-item" onclick="tambahItem()">+ Tambah Item</button>

                        <div class="form-actions">
                            <a th:href="@{/template}" class="btn btn-secondary">Batal</a>
                            <button type="submit" class="btn btn-primary">Simpan Template</button>
                        </div>

                    </form>
                </div>
            </div>

        </main>
    </div>

    <script th:src="@{/js/navigation.js}"></script>
    <script th:src="@{/js/custom-select.js}"></script>
    <script>
        let itemIndex = 1;

        function formatRupiahInput(input) {
            const cursorPosition = input.selectionStart;
            const originalLength = input.value.length;

            let raw = input.value.replace(/\D/g, '');
            if (raw.length > 1 && raw.startsWith('0')) {
                raw = raw.replace(/^0+/, '');
            }

            if (!raw) {
                input.value = '';
                return;
            }

            const formatted = raw.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            input.value = formatted;

            const diff = formatted.length - originalLength;
            const newCursor = Math.max(0, cursorPosition + diff);
            input.setSelectionRange(newCursor, newCursor);
        }

        function formatAllExistingAmounts() {
            document.querySelectorAll('.item-amount-input').forEach(function(input) {
                if (input.value) {
                    let num = input.value.replace(/\D/g, '');
                    if (num) {
                        input.value = num.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                    }
                }
            });
        }

        // Event delegation for automatic dots as user types
        document.getElementById('items-container').addEventListener('input', function(e) {
            if (e.target.classList.contains('item-amount-input')) {
                formatRupiahInput(e.target);
            }
        });

        // Strip dots before submitting form so backend receives clean numbers
        const form = document.querySelector('form');
        if (form) {
            form.addEventListener('submit', function() {
                document.querySelectorAll('.item-amount-input').forEach(function(input) {
                    input.value = input.value.replace(/\D/g, '');
                });
            });
        }

        document.addEventListener('DOMContentLoaded', formatAllExistingAmounts);

        function buildKategoriOptions() {
            const sel = document.getElementById('kategori-options-template');
            let html = '';
            for (let i = 0; i < sel.options.length; i++) {
                const opt = sel.options[i];
                html += '<option value="' + opt.value + '">' + opt.text + '</option>';
            }
            return html;
        }

        function tambahItem() {
            const container = document.getElementById("items-container");
            const item = document.createElement("div");
            item.classList.add("form-item");
            const kategoriOptions = buildKategoriOptions();
            item.innerHTML =
                '<div class="item-field">' +
                    '<label>Keterangan</label>' +
                    '<input type="text" name="items[' + itemIndex + '].keterangan" maxlength="225" placeholder="Contoh: Internet" required>' +
                '</div>' +
                '<div class="item-field">' +
                    '<label>Kategori</label>' +
                    '<select name="items[' + itemIndex + '].kategori.id" required>' +
                        kategoriOptions +
                    '</select>' +
                '</div>' +
                '<div class="item-field">' +
                    '<label>Jumlah</label>' +
                    '<div class="item-amount-group">' +
                        '<span class="currency-prefix">Rp</span>' +
                        '<input type="text" inputmode="numeric" name="items[' + itemIndex + '].jumlah" class="item-amount-input" placeholder="0" autocomplete="off" required>' +
                    '</div>' +
                '</div>' +
                '<button type="button" class="remove-item-btn" onclick="hapusItem(this)">&#10005;</button>';
            container.appendChild(item);
            itemIndex++;
        }

        function hapusItem(button) {
            const item = button.closest(".form-item");
            const semuaItem = document.querySelectorAll(".form-item");
            if (semuaItem.length > 1) {
                item.remove();
            }
        }
    </script>
</body>
</html>
