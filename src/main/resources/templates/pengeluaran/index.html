<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengeluaran - Finora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/pengeluaran.css}">
</head>

<body>
    <div class="paper-texture"></div>

    <div class="layout">
        <div th:replace="fragments/navigation :: mobile-header"></div>
        <div th:replace="fragments/navigation :: bottom-nav"></div>
        <div th:replace="fragments/navigation :: drawer-overlay"></div>
        <nav th:replace="fragments/navigation :: drawer"></nav>
        <aside th:replace="fragments/navigation :: sidebar"></aside>

        <main class="main-content">
            <div class="page-header" data-motion="enter" data-motion-delay="0">
                <div class="index-page-header-actions">
                    <div>
                        <p class="annotation">CATATAN PENGELUARAN</p>
                        <h1>Pengeluaran Anda</h1>
                        <p class="subtitle">Lihat ke mana uang Anda telah digunakan.</p>
                    </div>
                    <div class="header-action-btns">
                        <a href="/pengeluaran/create" class="btn btn-primary" data-motion="enter" data-motion-delay="100">+ Tambah pengeluaran</a>
                        <button class="btn btn-secondary" id="btnUseTemplate" data-motion="enter" data-motion-delay="140">Gunakan Template</button>
                    </div>
                </div>
            </div>

            <div class="total-expense-summary" data-motion="enter" data-motion-delay="180">
                <p class="label">total pengeluaran</p>
                <div class="value">
                    <span class="currency">Rp</span>
                    <span id="totalExpenseValue">0</span>
                </div>
            </div>

            <div class="filter-bar" id="filterBar" data-motion="enter" data-motion-delay="240">
                <div class="filter-row">
                    <div class="filter-group">
                        <label for="filterCategory">Kategori</label>
                        <select id="filterCategory">
                            <option value="">Semua kategori</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterDate">Periode</label>
                        <select id="filterDate">
                            <option value="all">Semua tanggal</option>
                            <option value="today">Hari ini</option>
                            <option value="this_month">Bulan ini</option>
                            <option value="last_month">Bulan lalu</option>
                            <option value="custom">Rentang tanggal...</option>
                        </select>
                    </div>
                    <div class="filter-group filter-group-date-range" id="dateInputs" style="display:none;">
                        <label>Rentang Tanggal</label>
                        <div class="date-range-fields">
                            <div class="date-field-col">
                                <input type="date" id="startDate" placeholder="Mulai" />
                            </div>
                            <span class="date-separator">s/d</span>
                            <div class="date-field-col">
                                <input type="date" id="endDate" placeholder="Selesai" />
                            </div>
                        </div>
                    </div>
                    <div class="filter-group">
                        <label for="filterSort">Urutan</label>
                        <select id="filterSort">
                            <option value="terbaru">Terbaru</option>
                            <option value="terlama">Terlama</option>
                        </select>
                    </div>
                    <div class="filter-actions">
                        <button class="btn btn-primary" id="btnApplyFilter">Terapkan</button>
                        <button class="btn btn-secondary" id="btnResetFilter">Reset</button>
                    </div>
                </div>
                <div class="active-filters" id="activeFilters" style="display:none;"></div>
            </div>

            <div class="expense-list-container" data-motion="enter" data-motion-delay="280">
                <div class="expense-list-header">
                    <span>Tanggal</span>
                    <span>Keterangan</span>
                    <span>Kategori</span>
                    <span>Jumlah</span>
                    <span></span>
                </div>

                <div class="expense-list" id="expenseList" data-motion-stagger="35" data-motion-stagger-base="320" data-motion-stagger-max="8">
                </div>
            </div>

        </main>
    </div>

    <div class="modal-overlay" id="templateModal">
        <div class="modal-container" style="max-width:600px;width:100%;max-height:85vh;overflow-y:auto;">
            <button class="modal-close" id="modalClose" aria-label="Close modal">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div style="text-align:left;">
                <p class="annotation" style="margin-bottom:4px;">TEMPLATE</p>
                <h2 style="font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:var(--ink-navy);margin:0 0 8px;letter-spacing:-0.3px;">Gunakan Template</h2>
                <p style="font-size:14px;color:var(--warm-gray);margin:0 0 24px;line-height:1.6;">Pilih template yang ingin digunakan.</p>
            </div>
            <div id="templateModalBody">
                <div style="text-align:center;padding:30px;color:var(--warm-gray);">
                    <div style="opacity:1;pointer-events:none;">Loading templates...</div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/navigation.js}"></script>
    <script th:src="@{/js/custom-select.js}"></script>
    <script th:src="@{/js/custom-datepicker.js}"></script>
    <script th:src="@{/js/motion.js}"></script>
    <script>
        var currentParams = { page: 0, size: 10, sort: 'terbaru', category: '', startDate: '', endDate: '' };
        var allCategories = [];

        async function loadCategories() {
            try {
                var res = await fetch('/kategori');
                if (!res.ok) return;
                var data = await res.json();
                allCategories = data.filter(function(k) { return k.jenis === 'PENGELUARAN'; });
                var sel = document.getElementById('filterCategory');
                allCategories.forEach(function(cat) {
                    var opt = document.createElement('option');
                    opt.value = cat.id;
                    opt.textContent = cat.nama;
                    sel.appendChild(opt);
                });
            } catch(e) { /* ignore */ }
        }

        function buildUrl(params) {
            var urlParams = new URLSearchParams();
            urlParams.set('page', params.page);
            urlParams.set('size', params.size);
            urlParams.set('sort', params.sort);
            if (params.category) urlParams.set('category', params.category);
            if (params.startDate) urlParams.set('startDate', params.startDate);
            if (params.endDate) urlParams.set('endDate', params.endDate);
            return '/pengeluaran?' + urlParams.toString();
        }

        function formatIdr(value) {
            return parseFloat(value || 0).toLocaleString('id-ID');
        }

        function getDateRangeByPreset(mode) {
            var today = new Date();
            function toISO(d) {
                var y = d.getFullYear();
                var m = String(d.getMonth() + 1).padStart(2, '0');
                var day = String(d.getDate()).padStart(2, '0');
                return y + '-' + m + '-' + day;
            }
            if (mode === 'today') {
                var str = toISO(today);
                return { start: str, end: str };
            }
            if (mode === 'this_month') {
                var first = new Date(today.getFullYear(), today.getMonth(), 1);
                var last = new Date(today.getFullYear(), today.getMonth() + 1, 0);
                return { start: toISO(first), end: toISO(last) };
            }
            if (mode === 'last_month') {
                var first = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                var last = new Date(today.getFullYear(), today.getMonth(), 0);
                return { start: toISO(first), end: toISO(last) };
            }
            return { start: '', end: '' };
        }

        function getFilterValues() {
            var cat = document.getElementById('filterCategory').value;
            var dateMode = document.getElementById('filterDate').value;
            var sort = document.getElementById('filterSort').value;
            var start = '';
            var end = '';

            if (dateMode === 'custom') {
                start = document.getElementById('startDate').value;
                end = document.getElementById('endDate').value;
            } else if (dateMode !== 'all') {
                var range = getDateRangeByPreset(dateMode);
                start = range.start;
                end = range.end;
            }

            return {
                page: 0,
                size: currentParams.size,
                sort: sort,
                category: cat || '',
                startDate: start || '',
                endDate: end || ''
            };
        }

        function setFilterValues(params) {
            document.getElementById('filterCategory').value = params.category || '';
            var hasDate = !!(params.startDate || params.endDate);
            var dateMode = 'all';

            if (hasDate) {
                var todayRange = getDateRangeByPreset('today');
                var thisMonthRange = getDateRangeByPreset('this_month');
                var lastMonthRange = getDateRangeByPreset('last_month');

                if (params.startDate === todayRange.start && params.endDate === todayRange.end) {
                    dateMode = 'today';
                } else if (params.startDate === thisMonthRange.start && params.endDate === thisMonthRange.end) {
                    dateMode = 'this_month';
                } else if (params.startDate === lastMonthRange.start && params.endDate === lastMonthRange.end) {
                    dateMode = 'last_month';
                } else {
                    dateMode = 'custom';
                }
            }

            var filterDateSelect = document.getElementById('filterDate');
            filterDateSelect.value = dateMode;
            var dateInputs = document.getElementById('dateInputs');
            dateInputs.style.display = (dateMode === 'custom') ? 'flex' : 'none';
            document.getElementById('startDate').value = params.startDate || '';
            document.getElementById('endDate').value = params.endDate || '';
            document.getElementById('filterSort').value = params.sort || 'terbaru';
        }

        function formatDisplayDate(isoStr) {
            if (!isoStr) return '';
            var parts = isoStr.split('-');
            if (parts.length !== 3) return isoStr;
            var months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
            var mIdx = parseInt(parts[1], 10) - 1;
            return parts[2] + ' ' + (months[mIdx] || parts[1]) + ' ' + parts[0];
        }

        function renderActiveFilters(params) {
            var el = document.getElementById('activeFilters');
            var chips = [];
            var catName = '';
            if (params.category) {
                var found = allCategories.find(function(c) { return String(c.id) === params.category; });
                catName = found ? found.nama : params.category;
                chips.push('<span class="chip">Kategori: ' + catName + '</span>');
            }
            if (params.startDate && params.endDate) {
                if (params.startDate === params.endDate) {
                    chips.push('<span class="chip">Tanggal: ' + formatDisplayDate(params.startDate) + '</span>');
                } else {
                    chips.push('<span class="chip">Periode: ' + formatDisplayDate(params.startDate) + ' — ' + formatDisplayDate(params.endDate) + '</span>');
                }
            } else if (params.startDate) {
                chips.push('<span class="chip">Dari: ' + formatDisplayDate(params.startDate) + '</span>');
            } else if (params.endDate) {
                chips.push('<span class="chip">Sampai: ' + formatDisplayDate(params.endDate) + '</span>');
            }
            if (params.sort && params.sort !== 'terbaru') {
                chips.push('<span class="chip">Urutan: Terlama</span>');
            }
            if (chips.length > 0) {
                el.innerHTML = '<div class="chip-group">' + chips.join('') + '</div>';
                el.style.display = 'block';
            } else {
                el.innerHTML = '';
                el.style.display = 'none';
            }
        }

        function getPageNumbers(current, total) {
            var pages = [];
            var delta = 2;
            var left = current - delta;
            var right = current + delta + 1;
            for (var i = 0; i < total; i++) {
                if (i === 0 || i === total - 1 || (i >= left && i < right)) {
                    pages.push(i);
                } else if (pages[pages.length - 1] !== '...') {
                    pages.push('...');
                }
            }
            return pages;
        }

        async function loadExpenses(params) {
            var expenseListEl = document.getElementById('expenseList');
            var totalExpenseValueEl = document.getElementById('totalExpenseValue');
            var paginationEl = document.getElementById('paginationControls');
            var url = buildUrl(params);

            if (paginationEl) {
                paginationEl.classList.add('loading');
            }
            expenseListEl.style.opacity = '0.5';
            expenseListEl.style.pointerEvents = 'none';

            try {
                var response = await fetch(url);
                if (!response.ok) throw new Error('Gagal mengambil data pengeluaran');
                var data = await response.json();

                expenseListEl.style.opacity = '1';
                expenseListEl.style.pointerEvents = 'auto';
                if (paginationEl) {
                    paginationEl.classList.remove('loading');
                }

                var totalField = data.totalExpense ?? data.totalPengeluaran ?? data.total ?? data.totalIncome ?? 0;
                totalExpenseValueEl.textContent = formatIdr(totalField);
                var expenseData = data.content || [];

                if (expenseData.length === 0) {
                    var hasActiveFilter = params.category || params.startDate || params.endDate;
                    if (hasActiveFilter) {
                        expenseListEl.innerHTML =
                            '<div class="empty-state">' +
                                '<p>Tidak ada pengeluaran yang sesuai dengan filter.</p>' +
                                '<span>Reset filter untuk melihat semua data.</span>' +
                                '<button class="btn btn-primary" id="btnResetEmpty">Reset Filter</button>' +
                            '</div>';
                        var resetBtn = document.getElementById('btnResetEmpty');
                        if (resetBtn) {
                            resetBtn.addEventListener('click', function(e) {
                                e.preventDefault();
                                currentParams = { page: 0, size: 10, sort: 'terbaru', category: '', startDate: '', endDate: '' };
                                setFilterValues(currentParams);
                                loadExpenses(currentParams);
                            });
                        }
                    } else {
                        expenseListEl.innerHTML =
                            '<div class="empty-state">' +
                                '<p>Belum ada pengeluaran tercatat.</p>' +
                                '<span>Mulai catat pengeluaran Anda dengan menambahkan entri pertama.</span>' +
                                '<a href="/pengeluaran/create" class="btn btn-primary">Tambah pengeluaran</a>' +
                            '</div>';
                    }
                } else {
                    expenseListEl.innerHTML = '';
                    expenseData.forEach(function(expense) {
                        var date = new Date(expense.tanggal);
                        var dateStr = date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();

                        var row = document.createElement('div');
                        row.className = 'expense-row is-visible';
                        row.innerHTML =
                            '<div class="expense-date">' + dateStr + '</div>' +
                            '<div class="expense-description">' + (expense.keterangan || '-') + '</div>' +
                            '<div class="expense-category">' + (expense.kategori ? expense.kategori.nama : 'Tanpa Kategori') + '</div>' +
                            '<div class="expense-amount">Rp ' + formatIdr(expense.jumlah) + '</div>' +
                            '<div class="expense-actions">' +
                                '<button class="delete-btn" data-id="' + expense.id + '">Hapus</button>' +
                            '</div>';
                        expenseListEl.appendChild(row);
                    });

                    document.querySelectorAll('.delete-btn').forEach(function(btn) {
                        btn.addEventListener('click', async function() {
                            var id = this.getAttribute('data-id');
                            if (confirm('Yakin ingin menghapus pengeluaran ini?')) {
                                try {
                                    var deleteResponse = await fetch('/pengeluaran/' + id, { method: 'DELETE' });
                                    if (deleteResponse.ok) {
                                        location.reload();
                                    } else {
                                        alert('Gagal menghapus pengeluaran.');
                                    }
                                } catch (error) {
                                    console.error('Error deleting expense:', error);
                                    alert('Koneksi gagal. Coba lagi nanti.');
                                }
                            }
                        });
                    });
                }

                renderPagination(data);
                renderActiveFilters(params);
            } catch (error) {
                console.error('Error fetching expenses:', error);
                expenseListEl.style.opacity = '1';
                expenseListEl.style.pointerEvents = 'auto';
                if (paginationEl) {
                    paginationEl.classList.remove('loading');
                }
                expenseListEl.innerHTML =
                    '<div class="empty-state">' +
                        '<p>Gagal memuat data pengeluaran.</p>' +
                        '<span>Periksa koneksi Anda dan coba lagi.</span>' +
                    '</div>';
            }
        }

        function renderPagination(data) {
            var paginationEl = document.getElementById('paginationControls');
            if (!paginationEl) {
                paginationEl = document.createElement('div');
                paginationEl.id = 'paginationControls';
                paginationEl.className = 'pagination-controls';
                var listContainer = document.querySelector('.expense-list-container');
                listContainer.appendChild(paginationEl);
            }

            var totalPages = data.totalPages || 1;
            var currentPage = data.currentPage || 0;

            if (totalPages <= 1) {
                paginationEl.innerHTML = '';
                return;
            }

            var html = '';

            var prevDisabled = currentPage === 0 ? 'disabled' : '';
            html += '<button class="page-nav-btn ' + prevDisabled + '" data-page="' + (currentPage - 1) + '" aria-label="Sebelumnya">' +
                '<span aria-hidden="true">&larr;</span> Sebelumnya</button>';

            var pageNumbers = getPageNumbers(currentPage, totalPages);
            pageNumbers.forEach(function(p) {
                if (p === '...') {
                    html += '<span class="page-ellipsis">...</span>';
                } else {
                    var isActive = p === currentPage ? 'active' : '';
                    html += '<button class="page-btn ' + isActive + '" data-page="' + p + '" aria-label="Halaman ' + (p + 1) + '" aria-current="' + (p === currentPage ? 'page' : 'false') + '">' + (p + 1) + '</button>';
                }
            });

            var nextDisabled = currentPage === totalPages - 1 ? 'disabled' : '';
            html += '<button class="page-nav-btn ' + nextDisabled + '" data-page="' + (currentPage + 1) + '" aria-label="Berikutnya">' +
                'Berikutnya <span aria-hidden="true">&rarr;</span></button>';

            paginationEl.innerHTML = html;

            paginationEl.querySelectorAll('.page-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var page = parseInt(this.getAttribute('data-page'));
                    currentParams.page = page;
                    loadExpenses(currentParams);
                });
            });

            paginationEl.querySelectorAll('.page-nav-btn:not([disabled])').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var page = parseInt(this.getAttribute('data-page'));
                    currentParams.page = page;
                    loadExpenses(currentParams);
                });
            });
        }

        document.addEventListener('DOMContentLoaded', async function() {
            await loadCategories();
            setFilterValues(currentParams);

            document.getElementById('filterDate').addEventListener('change', function() {
                var isCustom = this.value === 'custom';
                var dateInputs = document.getElementById('dateInputs');
                dateInputs.style.display = isCustom ? 'flex' : 'none';
                if (!isCustom && this.value !== 'all') {
                    var range = getDateRangeByPreset(this.value);
                    document.getElementById('startDate').value = range.start;
                    document.getElementById('endDate').value = range.end;
                } else if (this.value === 'all') {
                    document.getElementById('startDate').value = '';
                    document.getElementById('endDate').value = '';
                }
            });

            document.getElementById('btnApplyFilter').addEventListener('click', function() {
                var vals = getFilterValues();
                currentParams.category = vals.category;
                currentParams.startDate = vals.startDate;
                currentParams.endDate = vals.endDate;
                currentParams.sort = vals.sort;
                currentParams.page = 0;
                setFilterValues(currentParams);
                loadExpenses(currentParams);
            });

            document.getElementById('btnResetFilter').addEventListener('click', function() {
                currentParams = { page: 0, size: 10, sort: 'terbaru', category: '', startDate: '', endDate: '' };
                setFilterValues(currentParams);
                loadExpenses(currentParams);
            });

            loadExpenses(currentParams);

            // Template Modal
            const templateModal = document.getElementById('templateModal');
            const modalCloseBtn = document.getElementById('modalClose');
            const btnUseTemplate = document.getElementById('btnUseTemplate');
            let isUsingTemplate = false;

            function openTemplateModal() {
                templateModal.classList.add('is-visible');
                document.body.classList.add('modal-open');
                loadTemplateList();
            }

            function closeTemplateModal() {
                templateModal.classList.remove('is-visible');
                document.body.classList.remove('modal-open');
                isUsingTemplate = false;
            }

            btnUseTemplate.addEventListener('click', openTemplateModal);
            modalCloseBtn.addEventListener('click', closeTemplateModal);
            templateModal.addEventListener('click', function(e) {
                if (e.target === templateModal) closeTemplateModal();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && templateModal.classList.contains('is-visible')) closeTemplateModal();
            });

            async function loadTemplateList() {
                const body = document.getElementById('templateModalBody');
                body.innerHTML = '<div style="text-align:center;padding:30px;color:var(--warm-gray);"><div style="opacity:1;pointer-events:none;">Loading templates...</div></div>';
                try {
                    var res = await fetch('/pengeluaran/templates');
                    if (!res.ok) throw new Error('Failed');
                    var templates = await res.json();
                    renderTemplateCards(templates);
                } catch(e) {
                    body.innerHTML = '<div style="text-align:center;padding:30px;color:var(--warm-gray);"><p>Gagal memuat template.</p></div>';
                }
            }

            function renderTemplateCards(templates) {
                var body = document.getElementById('templateModalBody');
                if (!templates || templates.length === 0) {
                    body.innerHTML =
                        '<div style="text-align:center;padding:40px 20px;">' +
                            '<p style="font-family:\'Cormorant Garamond\',serif;font-size:20px;margin-bottom:10px;color:var(--ink-navy);">Belum ada template</p>' +
                            '<span style="font-size:14px;color:var(--warm-gray);display:block;margin-bottom:20px;">Template dapat digunakan untuk menambahkan beberapa transaksi sekaligus.</span>' +
                            '<a href="/template/create" class="btn btn-primary">Buat Template</a>' +
                        '</div>';
                    return;
                }

                var html = '<div style="display:flex;flex-direction:column;gap:12px;">';
                templates.forEach(function(tpl) {
                    var total = tpl.items ? tpl.items.reduce(function(sum, item) { return sum + (item.jumlah || 0); }, 0) : 0;
                    var itemCount = tpl.items ? tpl.items.length : 0;
                    html += '<div class="template-modal-card" style="background:var(--receipt-paper);border:1px solid rgba(217,197,165,0.3);border-radius:12px;padding:20px;position:relative;" data-template-card="' + tpl.id + '">';
                    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;">';
                    html += '<div style="flex:1;min-width:0;">';
                    html += '<h3 style="font-family:\'Cormorant Garamond\',serif;font-size:18px;font-weight:700;color:var(--ink-navy);margin:0 0 4px;">' + (tpl.nama || '-') + '</h3>';
                    html += '<p style="font-size:12px;color:var(--warm-gray);margin:0 0 8px;">' + itemCount + ' item | Total Rp ' + formatIdr(total) + '</p>';
                    html += '<div style="display:flex;flex-direction:column;gap:6px;">';
                    if (tpl.items && tpl.items.length > 0) {
                        tpl.items.forEach(function(item) {
                            var itemId = item.id || 0;
                            html += '<label style="font-size:13px;color:var(--charcoal);display:flex;gap:8px;align-items:center;cursor:pointer;padding:4px 8px;border-radius:6px;border:1px solid transparent;transition:all 200ms ease;" class="template-item-row" data-template-id="' + tpl.id + '" data-item-id="' + itemId + '">' +
                                '<input type="radio" name="item-' + tpl.id + '" value="' + itemId + '" class="item-radio" style="accent-color:var(--terracotta);">' +
                                '<span style="flex:1;">' + (item.keterangan || '-') + '</span>' +
                                '<span style="color:var(--warm-gray);font-size:11px;">' + (item.kategori || '-') + '</span>' +
                                '<span style="font-weight:600;color:var(--terracotta-dark);">Rp ' + formatIdr(item.jumlah) + '</span>' +
                            '</label>';
                        });
                    }
                    html += '</div></div>';
                    html += '<button class="btn gunakan-btn" data-template-id="' + tpl.id + '" data-item-id="" style="margin-top:12px;padding:8px 20px;font-size:13px;min-height:38px;background:var(--ink-navy);color:var(--ivory);border:none;border-radius:8px;cursor:pointer;font-family:Inter,sans-serif;font-weight:600;" disabled>Gunakan Item</button>';
                    html += '</div></div>';
                });
                html += '</div>';
                body.innerHTML = html;
            }

            var selectedItemId = null;
            var selectedTemplateId = null;

            document.getElementById('templateModalBody').addEventListener('change', function(e) {
                if (e.target.classList.contains('item-radio')) {
                    var card = e.target.closest('[data-template-card]');
                    var templateId = card ? card.getAttribute('data-template-card') : null;
                    var itemId = parseInt(e.target.value);
                    selectedTemplateId = templateId;
                    selectedItemId = itemId;
                    var btn = document.querySelector('[data-template-id="' + templateId + '"].gunakan-btn');
                    if (btn) {
                        btn.disabled = false;
                        btn.setAttribute('data-item-id', itemId);
                    }
                }
            });

            document.getElementById('templateModalBody').addEventListener('click', function(e) {
                var btn = e.target.closest('[data-template-id]');
                if (btn && btn.classList.contains('gunakan-btn')) {
                    e.stopPropagation();
                    var templateId = btn.getAttribute('data-template-id');
                    var itemId = btn.getAttribute('data-item-id');
                    if (!itemId || itemId === '') return;
                    lakukanGunakan(templateId, itemId, btn);
                }
            });

            async function lakukanGunakan(templateId, itemId, btnEl) {
                if (isUsingTemplate) return;
                isUsingTemplate = true;
                btnEl.textContent = 'Memproses...';
                btnEl.disabled = true;
                try {
                    var res = await fetch('/pengeluaran/template/use/' + templateId + '/' + itemId, { method: 'POST' });
                    if (!res.ok) {
                        var errData = await res.json().catch(function(){});
                        throw new Error(errData?.message || 'Gagal menggunakan item template');
                    }
                    closeTemplateModal();
                    await loadExpenses(currentParams);
                    var keterangan = '';
                    try {
                        var res2 = await fetch('/pengeluaran/templates');
                        if (res2.ok) {
                            var tplData = await res2.json();
                            var tpl = tplData.find(function(t) { return String(t.id) === String(templateId); });
                            if (tpl && tpl.items) {
                                var item = tpl.items.find(function(i) { return i.id === parseInt(itemId); });
                                if (item) keterangan = item.keterangan;
                            }
                        }
                    } catch(e) {}
                    alert((keterangan || 'Item') + ' berhasil ditambahkan.');
                } catch(e) {
                    alert('Item template gagal digunakan. Silakan coba lagi.');
                } finally {
                    isUsingTemplate = false;
                    var allBtns = document.querySelectorAll('.gunakan-btn');
                    allBtns.forEach(function(b) {
                        b.textContent = 'Gunakan Item';
                        b.disabled = true;
                        b.setAttribute('data-item-id', '');
                    });
                }
            }
        });
    </script>
</body>

</html>
