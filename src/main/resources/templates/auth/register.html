<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Register — Finora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" th:href="@{/css/auth.css?v=6}">
</head>

<body>

    <div class="auth-card">
        <div class="auth-card-header">
            <a th:href="@{/login}" class="back-link">
                <svg class="back-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
                Back
            </a>
            <div class="header-logo">
                <img th:src="@{/img/finora-logo.svg}" alt="Finora" />
            </div>
            <span class="header-brand-name">Finora</span>
        </div>

        <div class="auth-card-body">
            <p class="eyebrow">Sign Up</p>
            <h1 class="form-title">Create your account</h1>
            <p class="form-subtitle">Set up your Finora account and start keeping your finances organized.</p>

            <!-- Error Notification -->
            <div th:if="${error}" class="alert-box alert-error">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span th:text="${error}">An error occurred during registration.</span>
            </div>

            <!-- Form -->
            <form th:action="@{/register}" th:object="${user}" method="post" class="auth-form">
                <div class="form-section">
                    <p class="section-label">Personal</p>
                    <div class="auth-field">
                        <div class="auth-field-enter">
                            <label for="fullName">Full Name</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                                <input type="text" id="fullName" th:field="*{fullName}" placeholder="Enter your full name" required autofocus />
                            </div>
                        </div>
                    </div>

                    <div class="auth-field">
                        <div class="auth-field-enter">
                            <label for="username">Username</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="4"></circle>
                                    <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path>
                                </svg>
                                <input type="text" id="username" th:field="*{username}" placeholder="Choose a unique username" required />
                            </div>
                        </div>
                    </div>

                    <div class="auth-field">
                        <div class="auth-field-enter">
                            <label for="email">Email Address</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                                <input type="email" id="email" th:field="*{email}" placeholder="example@domain.com" required />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <p class="section-label">Security</p>
                    <div class="auth-field">
                        <div class="auth-field-enter">
                            <label for="password">Password</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                <input type="password" id="password" th:field="*{passwordHash}" placeholder="Minimum 6 characters" required minlength="6" />
                                <button type="button" class="btn-toggle-pwd" aria-label="Toggle password visibility" aria-pressed="false">
                                    <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg class="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="auth-field">
                        <div class="auth-field-enter">
                            <label for="confirmPassword">Confirm Password</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 2l-2 2m-1.5 1.5L14 9M9 14l-4 4v3h3l4-4m1.5-1.5L16 13"></path>
                                </svg>
                                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" required minlength="6" />
                                <button type="button" class="btn-toggle-pwd" aria-label="Toggle password visibility" aria-pressed="false">
                                    <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg class="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span class="btn-text">Create Account</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <div class="form-switch-prompt">
                <span>Already have an account?</span>
                <a th:href="@{/login}">Login</a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/password-toggle.js}"></script>
</body>
</html>
