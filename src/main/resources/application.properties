spring.application.name=finora
# Matikan eksekusi DDL otomatis saat startup agar tidak meminjam koneksi tambahan
# (Mencegah error: Unable to open JDBC Connection for DDL execution)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Dialect PostgreSQL & Pelepasan Koneksi ────────────────────────────────────
# Tetapkan Dialect eksplisit agar Hibernate tidak gagal resolve tanpa JDBC metadata
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Matikan Open Session in View agar koneksi langsung dilepas setelah transaksi selesai
spring.jpa.open-in-view=false

# ── Konfigurasi Datasource & HikariCP (Runova PostgreSQL) ─────────────────────
# URL diarahkan ke database Runova (bukan localhost) dengan database default: arya_finora
# Mendukung variabel SPRING_DATASOURCE_URL, DATABASE_URL, atau modular DB_HOST
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:arya_finora}}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${DB_USERNAME:${DB_USER:arya}}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${DB_PASSWORD:}}}

spring.datasource.hikari.pool-name=FinoraHikariCP
# Batasi maximum connection pool menjadi 2 (agar muat saat rolling deploy Runova di mana versi lama & baru aktif bersamaan)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:2}
# Atur minimum idle menjadi 1
spring.datasource.hikari.minimum-idle=1
# Timeout inisialisasi pool 30 detik untuk menunggu antrean koneksi jika database sedang sibuk
spring.datasource.hikari.initialization-fail-timeout=30000
# Idle timeout: 5 menit (300000 ms)
spring.datasource.hikari.idle-timeout=300000
# Max lifetime: 20 menit (1200000 ms) sebelum koneksi didaur ulang
spring.datasource.hikari.max-lifetime=1200000
# Connection timeout: 20 detik (20000 ms) saat menunggu koneksi tersedia
spring.datasource.hikari.connection-timeout=20000
# Validation timeout: 5 detik (5000 ms)
spring.datasource.hikari.validation-timeout=5000
# Leak detection threshold: 2 detik (2000 ms) untuk mendeteksi connection leak
spring.datasource.hikari.leak-detection-threshold=2000

spring.thymeleaf.cache=false
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
server.tomcat.max-http-form-post-size=12MB
spring.devtools.restart.enabled=${DEVTOOLS_RESTART:false}
server.port=8080
server.forward-headers-strategy=framework

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax


# ── Google OAuth2 (login) ────────────────────────────────────────────────────
# registration-id "google" → Spring Boot auto-detects provider Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ── Google OAuth2 (register) ─────────────────────────────────────────────────
# registration-id kustom "google-register" → wajib deklarasi provider secara eksplisit
spring.security.oauth2.client.registration.google-register.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google-register.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google-register.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google-register.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google-register.scope=openid,profile,email
spring.security.oauth2.client.registration.google-register.provider=google

# ── Google provider endpoints (diperlukan untuk custom registration-id) ───────
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
